services:
  - type: web
    name: mathquest-game
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mathquest-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: mathquest-db
