<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <title>MathQuest Live</title>

   <style>
        /* =========================================================
           THEME
           ========================================================= */

        :root {
            --gold: #ffd166;
            --cyan: #56d8ff;
            --panel: #102541;
            --bg: #061321;
            --muted: #9fb4c9;
            --danger: #ff7f8a;
            --border: #355578;
            --input-bg: #07182b;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-width: 320px;
        }

        body {
            margin: 0;
            min-width: 320px;

            background:
                radial-gradient(
                    circle at top,
                    #173c69,
                    var(--bg) 55%
                );

            color: #fff;

            font:
                16px system-ui,
                "Segoe UI",
                sans-serif;
        }

        /* =========================================================
           HEADER
           ========================================================= */

        header {
            position: sticky;
            top: 0;
            z-index: 5;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 16px;

            padding: 16px 5vw;

            background: #061321f2;
                                    );

                    draw(data);

                    if (
                        data.battle.status ===
                        "active"
                    ) {
                        answer.focus();
                    }
                } catch (error) {
                    log.textContent =
                        error.message;

                    log.classList
                        .add("error");
                }
            }
        );

        /* =========================================================
           KEYBOARD SUPPORT
           ========================================================= */

        /*
         * Pressing Enter in the answer field triggers Attack.
         */
        answer.addEventListener(
            "keydown",
            event => {
                if (
                    event.key === "Enter"
                ) {
                    attack.click();
                }
            }
        );

        /* =========================================================
           CHARACTER SELECTION LISTENERS
           ========================================================= */

        /*
         * Changing any of these values immediately reloads the
         * corresponding individual character portrait.
         */
        grade.addEventListener(
            "change",
            updateCharacterPreview
        );

        char.addEventListener(
            "change",
            updateCharacterPreview
        );

        variant.addEventListener(
            "change",
            updateCharacterPreview
        );

        /* =========================================================
           INITIAL PAGE LOAD
           ========================================================= */

        /*
         * Load the initial character portrait as soon as the page
         * is ready.
         */
        updateCharacterPreview();
    </script>

</body>
</html>
