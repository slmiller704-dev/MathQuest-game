<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MathQuest</title><style>
:root{--bg:#071526;--panel:#10243e;--gold:#ffd166;--cyan:#55d9ff;--muted:#b2c3d6;--danger:#ff6b77}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#173a66,var(--bg) 48%);color:#fff;font:16px system-ui,Segoe UI,sans-serif}header,main{padding:22px 5vw}header{background:#0a1b31dd;position:sticky;top:0;z-index:4;display:flex;justify-content:space-between;gap:15px;align-items:center}h1{color:var(--gold);margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.card,.arena{padding:18px;background:#10243ee8;border:1px solid #45627f;border-radius:16px}.character{color:#fff;text-align:left;background:#10243e;position:relative}.character.selected{outline:3px solid var(--gold)}.character.locked{filter:grayscale(.7);opacity:.68}.tag{position:absolute;right:10px;top:10px;background:#071526;padding:5px 8px;border-radius:999px;font-size:.75rem}.stats{color:var(--muted);font-size:.92rem}.ability{color:var(--cyan);font-weight:800}.bar{height:13px;background:#31445c;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--gold));transition:.25s}.fighters{display:grid;grid-template-columns:1fr 1fr;gap:22px}.question{font-size:clamp(1.6rem,5vw,3.3rem);text-align:center;margin:30px 0}button,input,select{font:inherit;padding:10px 13px;border-radius:9px;border:1px solid #5a6c82}button{background:var(--gold);font-weight:800;cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}input,select{background:#081729;color:white}.controls{display:flex;gap:10px;flex-wrap:wrap}.reward{border-left:5px solid var(--gold)}.art{width:100%;border-radius:16px;margin-top:22px}.notice{color:var(--gold)}.damage{color:var(--danger)}@media(max-width:650px){header{align-items:flex-start;flex-direction:column}.fighters{grid-template-columns:1fr}}
</style></head><body><header><div><h1>MathQuest</h1><small>Learn • Battle • Grow • Unlock</small></div><div>Level <b id="level">1</b> • XP <b id="xp">0</b> • Coins <b id="coins">0</b></div></header><main>
<label>Grade <select id="grade"><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option selected>9</option><option>10</option><option>11</option><option>12</option></select></label>
<h2>Choose Your Character</h2><p>Win battles and level up to unlock new heroes.</p><div class="controls"><label>Character version <select id="variant"><option value="boy">Boy</option><option value="girl">Girl</option></select></label></div><div id="characters" class="grid"></div>
<h2>Math Battle Arena</h2><section class="arena"><div class="fighters"><div><b id="hero">Knight</b><div class="bar"><i id="playerBar" style="width:100%"></i></div><small id="playerText">120 HP</small></div><div><b>Number Guardian</b><div class="bar"><i id="enemyBar" style="width:100%"></i></div><small id="enemyText">100 HP</small></div></div><div id="question" class="question">Press New Battle</div><div class="controls"><input id="answer" inputmode="numeric" placeholder="Your answer"><button id="attack" type="button">Attack</button><button id="ability" type="button">Use Ability</button><button id="newBattle" type="button">New Battle</button></div><p id="message" class="notice" aria-live="polite"></p><p id="hint"></p></section>
<h2>Unlock Rewards</h2><div id="rewards" class="grid"></div><img class="art" src="/static/assets/all_character_variants.png" alt="MathQuest boy and girl versions of all younger and high-school character classes"></main>
<script>
const C={Knight:{hp:120,power:12,focus:8,speed:7,ability:'Fortify',unlock:1},Wizard:{hp:90,power:14,focus:13,speed:8,ability:'Insight',unlock:1},Engineer:{hp:100,power:10,focus:12,speed:9,ability:'Optimize',unlock:1},Ranger:{hp:100,power:11,focus:10,speed:13,ability:'Precision',unlock:1},Ninja:{hp:90,power:12,focus:10,speed:15,ability:'Quick Think',unlock:1},Paladin:{hp:125,power:10,focus:11,speed:7,ability:'Encourage',unlock:1},Fairy:{hp:85,power:9,focus:15,speed:14,ability:'Spark of Insight',unlock:2},Jester:{hp:95,power:10,focus:12,speed:15,ability:'Wildcard',unlock:3},Warlock:{hp:100,power:15,focus:14,speed:8,ability:'Arcane Equation',unlock:4}};
let state=JSON.parse(localStorage.getItem('mqState')||'{"level":1,"xp":0,"coins":0,"selected":"Knight","variant":"boy"}');state.variant=state.variant||'boy';let battle=null;const $=id=>document.getElementById(id);function save(){localStorage.setItem('mqState',JSON.stringify(state));$('level').textContent=state.level;$('xp').textContent=state.xp;$('coins').textContent=state.coins;renderCharacters();renderRewards()}
function renderCharacters(){$('characters').innerHTML=Object.entries(C).map(([name,c])=>{const locked=state.level<c.unlock;return `<button class="card character ${state.selected===name?'selected':''} ${locked?'locked':''}" ${locked?'disabled':''} onclick="selectCharacter('${name}')"><span class="tag">${locked?'Unlock L'+c.unlock:'Ready'}</span><h3>${name}</h3><div class="ability">${c.ability}</div><p class="stats">HP ${c.hp} • Power ${c.power} • Focus ${c.focus} • Speed ${c.speed}</p></button>`}).join('')}
function selectCharacter(name){state.selected=name;state.variant=$('variant').value;save();$('hero').textContent=`${state.variant==='boy'?'Boy':'Girl'} ${name}`;$('message').textContent=`${state.variant==='boy'?'Boy':'Girl'} ${name} selected. ${C[name].ability} is ready.`}
function renderRewards(){const rewards=[['Level 2','Fairy + 50 coins',2],['Level 3','Jester + title badge',3],['Level 4','Warlock + Arcane effect',4],['Level 5','Golden outfit colors',5],['Level 6','Crystal weapon skin',6]];$('rewards').innerHTML=rewards.map(([t,d,l])=>`<div class="card reward"><h3>${state.level>=l?'✓ ':''}${t}</h3><p>${d}</p><small>${state.level>=l?'Unlocked':'Keep battling'}</small></div>`).join('')}
async function getProblem(easier=false){const g=+grade.value;let d=await fetch('/api/question/'+g).then(r=>r.json());if(easier&&g>5){const a=Math.floor(Math.random()*8)+2,b=Math.floor(Math.random()*8)+2;d={prompt:`${a} × ${b} = ?`,answer:a*b}}battle.prompt=d.prompt;battle.answer=d.answer;$('question').textContent=d.prompt;$('hint').textContent=''}
async function newBattle(){const c=C[state.selected];battle={player:c.hp,enemy:100,max:c.hp,used:false,fortify:false,precision:false,double:false,xpBoost:1};$('ability').disabled=false;await getProblem();draw();$('message').textContent='Battle started. Solve the problem to attack.'}
function draw(){$('hero').textContent=`${state.variant==='boy'?'Boy':'Girl'} ${state.selected}`;$('playerBar').style.width=Math.max(0,battle.player/battle.max*100)+'%';$('enemyBar').style.width=Math.max(0,battle.enemy)+'%';$('playerText').textContent=battle.player+' HP';$('enemyText').textContent=battle.enemy+' HP'}
function useAbility(){if(!battle||battle.used)return;$('ability').disabled=true;battle.used=true;const a=C[state.selected].ability;let msg='';if(a==='Fortify'){battle.fortify=true;msg='Fortify: the next incorrect answer deals 50% less damage.'}if(a==='Insight'){$('hint').textContent='Hint: break multiplication into smaller facts, or isolate x using inverse operations.';msg='Insight revealed a strategy hint.'}if(a==='Optimize'){$('hint').textContent=`One useful checkpoint: the answer is ${battle.answer%2===0?'even':'odd'}.`;msg='Optimize removed uncertainty.'}if(a==='Precision'){battle.precision=true;msg='Precision: the next correct attack deals 50% more damage.'}if(a==='Quick Think'){state.xp+=5;msg='Quick Think: time bonus converted to +5 XP in this untimed MVP.'}if(a==='Encourage'){battle.player=Math.min(battle.max,battle.player+20);msg='Encourage restored 20 HP.'}if(a==='Spark of Insight'){$('hint').textContent=`Hints: the answer is ${battle.answer%2===0?'even':'odd'} and has ${String(Math.abs(battle.answer)).length} digit(s).`;battle.player=Math.min(battle.max,battle.player+10);battle.xpBoost=1.1;msg='Spark of Insight gave two hints, healing, and an XP boost.'}if(a==='Wildcard'){const n=Math.floor(Math.random()*3);if(n===0){battle.double=true;msg='Wildcard rolled double damage.'}else if(n===1){battle.player=Math.min(battle.max,battle.player+15);msg='Wildcard healed 15 HP.'}else{state.xp+=10;msg='Wildcard awarded 10 bonus XP.'}}if(a==='Arcane Equation'){getProblem(true);battle.double=true;msg='Arcane Equation transformed the problem and charged extra damage.'}draw();save();$('message').textContent=msg}
async function attack(){if(!battle)return newBattle();const ok=Number($('answer').value)===Number(battle.answer);let msg='';if(ok){let damage=15+C[state.selected].power;if(battle.precision){damage=Math.round(damage*1.5);battle.precision=false}if(battle.double){damage*=2;battle.double=false}battle.enemy=Math.max(0,battle.enemy-damage);const gain=Math.round(20*battle.xpBoost);state.xp+=gain;state.coins+=5;msg=`Correct! ${damage} damage and +${gain} XP.`}else{let damage=battle.fortify?8:15;battle.fortify=false;battle.player=Math.max(0,battle.player-damage);msg=`Not yet. You took ${damage} damage.`}while(state.xp>=state.level*100){state.xp-=state.level*100;state.level++;state.coins+=50;msg+=` Level up! Level ${state.level} rewards unlocked.`}if(battle.enemy===0){state.coins+=25;msg+=' Victory Chest earned: +25 coins.';battle=null}else if(battle.player===0){msg+=' The guardian won. Start a new battle and try another strategy.';battle=null}else await getProblem();$('answer').value='';$('message').textContent=msg;if(battle)draw();save()}
$('attack').onclick=attack;$('ability').onclick=useAbility;$('newBattle').onclick=newBattle;grade.onchange=()=>{if(battle)getProblem()};save();$('hero').textContent=`${state.variant==='boy'?'Boy':'Girl'} ${state.selected}`;
</script></body></html>
