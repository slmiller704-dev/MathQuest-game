<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MathQuest Live</title><style>
:root{--gold:#ffd166;--cyan:#56d8ff;--panel:#102541;--bg:#061321}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#173c69,var(--bg) 55%);color:#fff;font:16px system-ui,Segoe UI,sans-serif}header,main{padding:20px 5vw}header{background:#061321e8;display:flex;justify-content:space-between;position:sticky;top:0;z-index:5}h1{color:var(--gold);margin:0}.setup,.arena,.lesson,.card{background:#102541e8;border:1px solid #355578;border-radius:18px;padding:18px}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:end}label{display:grid;gap:5px}select,input,button{padding:10px;border-radius:9px;font:inherit}select,input{background:#07182b;color:white;border:1px solid #5d7690}button{border:0;background:var(--gold);font-weight:800;cursor:pointer}.ghost{background:#244464;color:#fff}.fighters{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin:25px 0}.fighter{text-align:center}.avatar{margin:auto;width:min(260px,38vw);aspect-ratio:1;border-radius:50%;background-image:url('/static/assets/characters.png');background-size:600% 300%;border:5px solid #ffffff55;box-shadow:0 0 35px #56d8ff55;animation:float 2.4s ease-in-out infinite}.enemy{background:radial-gradient(circle,#b34dff,#361650 70%);display:grid;place-items:center;font-size:5rem;animation:pulse 1.5s infinite}.enemy:after{content:'∑'}.attack{animation:strike .45s ease}.hurt{animation:shake .38s ease}.bar{height:14px;background:#31485f;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--gold));transition:.35s}.question{text-align:center;font-size:clamp(1.7rem,4vw,3.2rem);margin:25px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.mastery{height:10px;background:#2b4158;border-radius:8px;overflow:hidden}.mastery i{display:block;height:100%;background:#66e08c}.log{min-height:26px;color:var(--gold)}@keyframes float{50%{transform:translateY(-12px)}}@keyframes pulse{50%{box-shadow:0 0 50px #b34dff}}@keyframes strike{50%{transform:translateX(70px) scale(1.12)}}@keyframes shake{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}@media(max-width:650px){.fighters{gap:12px}.avatar{width:38vw}.question{margin:18px 0}}
</style></head><body><header><div><h1>MathQuest Live</h1><small>Adaptive learning battles</small></div><div>Level <b id="lvl">1</b> • XP <b id="xp">0</b> • Coins <b id="coins">0</b></div></header><main>
<section class="setup"><div class="controls"><label>Grade<select id="grade"><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option selected>9</option><option>10</option><option>11</option><option>12</option></select></label><label>Character<select id="char"></select></label><label>Version<select id="variant"><option value="boy">Boy</option><option value="girl">Girl</option></select></label><button id="start">Start Battle</button></div></section>
<section class="arena" style="margin-top:16px"><div class="fighters"><div class="fighter"><div id="hero" class="avatar"></div><h3 id="heroName">Choose a hero</h3><div class="bar"><i id="hp" style="width:100%"></i></div><small id="hpText">HP</small></div><div class="fighter"><div id="enemy" class="avatar enemy"></div><h3>Number Guardian</h3><div class="bar"><i id="enemyHp" style="width:100%"></i></div><small id="enemyText">100 HP</small></div></div><div id="question" class="question">Start a battle to begin learning.</div><div class="controls" style="justify-content:center"><input id="answer" inputmode="decimal" placeholder="Enter answer"><button id="attack">Attack</button><button id="ability" class="ghost">Use Ability</button></div><p id="log" class="log" aria-live="polite"></p></section>
<section class="lesson" style="margin-top:16px"><h2>Learning Mastery</h2><p>The next question favors skills that need more practice.</p><div id="mastery" class="grid"></div></section></main><script>
const classes=['Knight','Wizard','Engineer','Ranger','Ninja','Paladin','Fairy','Jester','Warlock'];char.innerHTML=classes.map(x=>`<option>${x}</option>`).join('');let S=null,started=Date.now();const pos={Knight:[0,0],Wizard:[1,0],Engineer:[2,0],Ranger:[3,0],Ninja:[4,0],Paladin:[5,0],Fairy:[0,1],Jester:[1,1],Warlock:[2,1]};
async function api(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.detail);return d}function styleHero(){const [x,y]=pos[char.value];hero.style.backgroundPosition=`${x*20}% ${y*50}%`;heroName.textContent=`${variant.value==='boy'?'Boy':'Girl'} ${char.value}`}
function draw(d){S=d;lvl.textContent=d.character.level;xp.textContent=d.character.xp;coins.textContent=d.character.coins;question.textContent=d.battle.prompt||'Battle complete';hp.style.width=Math.max(0,d.battle.hp/130*100)+'%';enemyHp.style.width=Math.max(0,d.battle.enemy_hp)+'%';hpText.textContent=d.battle.hp+' HP';enemyText.textContent=d.battle.enemy_hp+' HP';log.textContent=d.message;mastery.innerHTML=Object.keys(d.mastery).length?Object.entries(d.mastery).map(([k,v])=>`<div class="card"><b>${k}</b><div class="mastery"><i style="width:${v}%"></i></div><small>${v}% mastery</small></div>`).join(''):'<div class="card">Complete answers to build a mastery profile.</div>';started=Date.now()}
start.onclick=async()=>{styleHero();draw(await api('/api/start',{grade:+grade.value,archetype:char.value,variant:variant.value}))};attack.onclick=async()=>{if(!S)return start.click();try{const d=await api('/api/answer',{session_id:S.session_id,answer:+answer.value,seconds:(Date.now()-started)/1000});(d.event==='hit'||d.event==='victory'?hero:enemy).classList.add(d.event==='hit'||d.event==='victory'?'attack':'hurt');setTimeout(()=>{hero.classList.remove('attack');enemy.classList.remove('hurt')},500);answer.value='';draw(d)}catch(e){log.textContent=e.message}};ability.onclick=async()=>{if(!S)return;draw(await api('/api/ability',{session_id:S.session_id}))};answer.onkeydown=e=>{if(e.key==='Enter')attack.click()};char.onchange=styleHero;variant.onchange=styleHero;styleHero();
</script></body></html>
